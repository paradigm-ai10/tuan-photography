<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tuan photography 陳亮元</title>
<meta name="description" content="Thomas Chen's landscape photographs, set out by the trips that made them.">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap">
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="orrery.css">
<link rel="stylesheet" href="../../journey/new/review.css">
<script type="importmap">
{ "imports": { "three": "../../journey/vendor/three/three.module.js" } }
</script>
<script>
  /* decide the page's mode before it paints: moving instrument, still instrument, or no instrument */
  (function () {
    var h = document.documentElement, gl = false;
    try { var c = document.createElement('canvas'); gl = !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) {}
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    /* ?still and ?nogl show the two quiet versions on any machine */
    if (/[?&]still\b/.test(location.search)) still = true;
    if (/[?&]nogl\b/.test(location.search)) gl = false;
    h.classList.add(!gl ? 'nogl' : still ? 'still' : 'gl');
    try { var l = localStorage.getItem('orrery-lang'); if (l === 'zh') { h.lang = 'zh-Hant'; h.dataset.lang = 'zh'; } } catch (e) {}
  })();
</script>
<script src="../../journey/data.js"></script>
<script src="../../journey/vendor/d3.min.js"></script>
<script src="../../journey/vendor/topojson-client.min.js"></script>
</head>
<body>
<a class="skip" href="#portfolio" data-i18n="skip">Skip to the portfolio</a>

<header class="bar" id="bar">
  <a class="brand" href="./" data-i18n="brand">tuan photography</a>
  <nav class="bar-words" aria-label="Site">
    <a href="#portfolio" data-i18n="navPortfolio">Portfolio</a>
    <a href="#guides" data-i18n="navGuides">Guides</a>
    <a href="#trips" data-i18n="navTrips">Trips</a>
    <button type="button" class="lang" id="lang" data-i18n="switch" lang="zh-Hant">中文</button>
  </nav>
</header>

<main>
  <section class="time" id="time" aria-labelledby="time-title">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="orrery" aria-hidden="true"></canvas>
      </div>
    </div>

    <div class="steps" id="steps">
      <div class="intro" id="intro">
        <div class="intro-words">
          <h1 data-i18n="title">Thomas Chen</h1>
          <p class="lede" data-i18n="lede">Landscape photographs from the road, set out by the trips that made them.</p>
        </div>
        <figure class="fall" id="fall"></figure>
      </div>
      <h2 class="sr-only" id="time-title" data-i18n="timeTitle">The trips, oldest first</h2>
      <!-- one article per trip, written in by orrery.js from data.js -->
    </div>
  </section>

  <section class="portfolio" id="portfolio" aria-labelledby="portfolio-title">
    <h2 id="portfolio-title" data-i18n="portfolio">Portfolio</h2>
    <div class="rows" id="rows"></div>
    <p class="more"><a href="../../gallery.html" data-i18n="portfolioLink">See the portfolio</a></p>
  </section>

  <section class="guides" id="guides" aria-labelledby="guides-title">
    <h2 id="guides-title" data-i18n="guides">Guides</h2>
    <div class="guide" id="guide"></div>
  </section>

  <section class="trips" id="trips" aria-labelledby="trips-title">
    <h2 id="trips-title" data-i18n="trips">Trips</h2>
    <div class="years" id="years"></div>
    <p class="more"><a href="../../journey/" data-i18n="tripsLink">All the trips, on the map</a></p>
  </section>
</main>

<footer class="foot">
  <p class="foot-name" data-i18n="footName">Thomas Chen, Taiwan</p>
  <p><a id="ig" href="https://www.instagram.com/tuan_1127/">Instagram @tuan_1127</a></p>
</footer>

<script type="module" src="orrery.js"></script>
<!-- his Notes box (score, note, pinned moments), on his own Mac only; saves to ideas/reviews/design5.json -->
<script src="../../journey/new/review.js" data-name="design5" data-id="orrery" data-back=""></script>
</body>
</html>
