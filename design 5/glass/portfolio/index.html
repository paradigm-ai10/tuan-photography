<script>
  // decide before anything paints: no WebGL (or ?nogl) shows the plain list; reduced motion (or ?still) shows no motion
  (function () {
    var h = document.documentElement, q = location.search, gl = false;
    try { var c = document.createElement('canvas'); gl = !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) {}
    if (!gl || /[?&]nogl\b/.test(q)) h.classList.add('no-gl');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]still\b/.test(q)) h.classList.add('still');
    try { if (localStorage.getItem('d5-lang') === 'zh') { h.lang = 'zh-Hant'; h.dataset.lang = 'zh'; } } catch (e) {}
  })();
</script>
