<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tuan photography 陳亮元</title>
<meta name="description" content="Thomas Chen's photographs, standing where they were taken.">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="world.css">
<script type="importmap">
{ "imports": {
  "three": "../journey/vendor/three/three.module.js",
  "three/lines/": "../journey/vendor/three/lines/"
} }
</script>
<script src="../journey/data.js"></script>
<script src="../journey/vendor/d3.min.js"></script>
<script src="../journey/vendor/topojson-client.min.js"></script>
</head>
<body>
<a class="skip" href="#story" data-i18n="skip">Skip to the places</a>

<header class="bar">
  <a class="name" href="../index.html" data-i18n="name">Thomas Chen</a>
  <nav class="bar-words" aria-label="Site">
    <button type="button" class="word" id="places-open" aria-haspopup="dialog" data-i18n="places">Places</button>
    <button type="button" class="word" id="lang" data-i18n="switch" lang="zh-Hant">中文</button>
  </nav>
</header>

<canvas id="world" aria-hidden="true"></canvas>

<main id="story">
  <section class="opening" id="top">
    <h1 class="sr-only" data-i18n="title">Thomas Chen, landscape photographs</h1>
    <p class="lede" data-i18n="lede">Photographs from the road, standing where they were taken.</p>
  </section>
  <!-- the places are written in by world.js, from data.js -->
</main>

<p class="hovercap" id="hovercap" aria-hidden="true"><span class="hc-place"></span><span class="hc-where"></span></p>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="v-place" hidden>
  <figure class="v-figure">
    <img id="v-img" alt="">
    <figcaption class="v-cap">
      <h2 class="v-place" id="v-place"></h2>
      <p class="v-where" id="v-where"></p>
      <p class="v-note" id="v-note"></p>
      <p class="v-best" id="v-best"></p>
      <p class="v-made" id="v-made"></p>
    </figcaption>
  </figure>
  <div class="v-words">
    <button type="button" class="word" id="v-prev" data-i18n="prev">Previous</button>
    <button type="button" class="word" id="v-next" data-i18n="next">Next</button>
    <button type="button" class="word" id="v-close" data-i18n="close">Close</button>
  </div>
</div>

<div class="places" id="places" role="dialog" aria-modal="true" aria-labelledby="places-title" hidden>
  <div class="places-inner">
    <h2 class="places-title" id="places-title" data-i18n="places">Places</h2>
    <ol class="places-list" id="places-list"></ol>
    <button type="button" class="word places-close" id="places-close" data-i18n="close">Close</button>
  </div>
</div>

<script type="module" src="world.js"></script>
</body>
</html>
